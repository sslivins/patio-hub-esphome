# ============================================================================
# Patio Hub  —  M5Stack Core2 v1.1  (HYBRID native-LVGL build)
#
# ESPHome owns WiFi / native API / OTA / logging. The `patio_ui` external
# component owns the WHOLE display stack itself (esp_lcd + esp_lvgl_port DMA
# flush via the M5Stack BSP), giving the smooth, native-feeling swipe UI that
# ESPHome's own mipi_spi + lvgl pipeline cannot (blocking polled SPI +
# single-buffered synchronous flush).
#
# We therefore DO NOT declare `display:`, `lvgl:`, `i2c:`, `touchscreen:` or an
# axp2101 component here — the component is the single owner of I2C, the panel,
# the PMIC power rails and the one LVGL instance.
#
# All board-INDEPENDENT config (WiFi, API, OTA, the patio_ui block with its
# screens/lights/media entities) lives in common/patio-hub-common.yaml. This
# entrypoint adds only the Core2-specific board + PSRAM. The CoreS3 build is
# the sibling patio-hub-cores3.yaml.
#
# NOTE: enable "Allow the device to perform Home Assistant actions" on this
# device's ESPHome integration in HA, or Start/Stop won't call the scripts.
# ============================================================================
substitutions:
  name: patio-hub
  friendly_name: Patio Hub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    upload_speed: 460800

esp32:
  board: m5stack-core2
  framework:
    type: esp-idf
    sdkconfig_options:
      # Enable the ESP-IDF power-management framework so patio_ui can drop the
      # CPU to 80 MHz while the screen is asleep (DFS only; no light sleep).
      CONFIG_PM_ENABLE: y

psram:
  mode: quad
  speed: 80MHz

packages:
  common: !include common/patio-hub-common.yaml

# On-battery deep sleep with FT6336 tap-wake (Core2-specific). GPIO39 is the
# touch controller INT — an RTC-capable pin, so it can wake the ESP32 from deep
# sleep via ext0. The panel/touch rail (ALDO2) stays powered while asleep so a
# tap is still detected; only the backlight rail (BLDO1) is cut by the UI's
# screen-sleep. No sleep_duration/run_duration -> the device only sleeps when
# the patio_ui policy asks (on battery + screen idle), never on USB, and never
# on a timer — so there are zero periodic wake bursts. A tap reboots straight
# back into the UI (OTA can ride on any user-initiated wake).
deep_sleep:
  id: deep_sleep_ctl
  wakeup_pin:
    number: GPIO39
    inverted: true            # touch INT is active-low
  wakeup_pin_mode: INVERT_WAKEUP

# Wire the UI's deep-sleep policy trigger to the board's deep_sleep mechanism.
# Package-merged into the shared patio_ui defined in common/ (which owns the
# `id` + all entity config); `variant` still defaults to core2 here.
patio_ui:
  on_deep_sleep_request:
    - deep_sleep.enter: deep_sleep_ctl

# patio_ui `variant` defaults to core2, so no override is needed here.
