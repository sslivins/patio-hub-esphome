# ============================================================================
# Patio Hub  (M5Stack Core2 v1.1)  —  HYBRID native-LVGL build
#
# ESPHome owns WiFi / native API / OTA / logging. The `patio_ui` external
# component owns the WHOLE display stack itself (esp_lcd + esp_lvgl_port DMA
# flush via the M5Stack Core2 BSP), giving the smooth, native-feeling swipe UI
# that ESPHome's own mipi_spi + lvgl pipeline cannot (blocking polled SPI +
# single-buffered synchronous flush).
#
# We therefore DO NOT declare `display:`, `lvgl:`, `i2c:`, `touchscreen:` or an
# axp2101 component here — the component is the single owner of I2C, the panel,
# the PMIC power rails and the one LVGL instance.
#
# The heater tile drives the HA patio-heater timer through the native API.
# NOTE: enable "Allow the device to perform Home Assistant actions" on this
# device's ESPHome integration in HA, or Start/Stop won't call the scripts.
# ============================================================================
substitutions:
  name: patio-hub
  friendly_name: Patio Hub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    upload_speed: 460800

esp32:
  board: m5stack-core2
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [patio_ui]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Patio Hub Fallback"

captive_portal:

logger:
  level: DEBUG
  # UART0 shares pins with USB-serial on the Core2; keep hardware UART logging.

api:
  encryption:
    key: !secret core2_patio_api_key
  # Required for the patio_ui component's native-API bridge:
  #   homeassistant_states   -> subscribe_homeassistant_state() (timer countdown)
  #   homeassistant_services -> call_homeassistant_service()     (Start/Stop)
  homeassistant_states: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret core2_patio_ota_password

# The native-LVGL patio UI + Home Assistant heater-timer bridge.
patio_ui:
  id: patio_hub_ui
  timer_entity: timer.patio_heaters
  run_script: script.patio_heater_run
  stop_script: script.patio_heater_stop
  default_minutes: 30
  min_minutes: 5
  max_minutes: 480
  # Perimeter screen map (as seen standing in front of the Core2):
  #   left / right      -> the single side screens
  #   rear_left/rear_right -> the two side-by-side screens on the wall behind you
  # Stand-in covers on the Mercer Island HA (office shades) until the real
  # Sun Peaks Caseta screen covers exist; just swap the entity_id later.
  screens:
    left:
      entity_id: cover.office_front_left_shade
      label: "Left"
    right:
      entity_id: cover.office_front_right_shade
      label: "Right"
    rear_left:
      entity_id: cover.office_front_center_shade
      label: "Rear Left"
    rear_right:
      entity_id: cover.office_door_shade
      label: "Rear Right"
