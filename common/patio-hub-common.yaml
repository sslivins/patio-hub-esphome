# ============================================================================
# Patio Hub  —  shared, board-INDEPENDENT config (included as a package)
#
# Everything here is identical on every board. The board-specific entrypoints
# (patio-hub.yaml for Core2, patio-hub-cores3.yaml for CoreS3) add only the
# `esp32:` board, the `psram:` mode, and (for CoreS3) the patio_ui `variant`
# override. Because the patio_ui component talks to the generic esp-bsp API,
# the whole UI + Home Assistant bridge below never changes between boards.
#
# NOTE: relative paths here (external_components `path:`, `!secret`) resolve
# against the *entrypoint* config's directory (the repo root), not this file.
# ============================================================================

external_components:
  - source:
      type: local
      path: components
    components: [patio_ui]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains-powered always-on hub: keep the radio fully awake so it never drops off
  # the LAN (multi-AP mesh + modem-sleep otherwise makes it miss ARP/beacons and
  # go "unavailable" in HA when idle). Deep sleep on battery is unaffected.
  power_save_mode: none
  ap:
    ssid: "Patio Hub Fallback"

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret core2_patio_api_key
  # Required for the patio_ui component's native-API bridge:
  #   homeassistant_states   -> subscribe_homeassistant_state() (timer countdown)
  #   homeassistant_services -> call_homeassistant_service()     (Start/Stop)
  homeassistant_states: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret core2_patio_ota_password

# Device clock, synced from Home Assistant (single source of truth — same clock
# as the timer's `finishes_at`, LAN-reliable at the remote site).
time:
  - platform: homeassistant
    id: ha_time

# The native-LVGL patio UI + Home Assistant heater-timer bridge. `variant`
# defaults to core2; the CoreS3 entrypoint overrides it via `!extend`.
patio_ui:
  id: patio_hub_ui
  timer_entity: timer.patio_heaters
  time_id: ha_time
  # Outside temperature shown on the clock tile. Displayed in °C (the component
  # converts from °F when the sensor reports Fahrenheit). Currently a Mercer
  # Island stand-in outdoor sensor; swap to sensor.usl_environmental_temperature_3
  # once the device's HA can reach the Sun Peaks instance.
  temp_sensor: sensor.outdoor_kitchen_sensor_temperature
  run_script: script.patio_heater_run
  stop_script: script.patio_heater_stop
  default_minutes: 30
  min_minutes: 15
  max_minutes: 60
  # Perimeter screen map (as seen standing in front of the device):
  #   left / right      -> the single side screens
  #   rear_left/rear_right -> the two side-by-side screens on the wall behind you
  # Stand-in covers on the Mercer Island HA (office shades) until the real
  # Sun Peaks Caseta screen covers exist; just swap the entity_id later.
  screens:
    left:
      entity_id: cover.office_front_left_shade
      label: "Left"
    right:
      entity_id: cover.office_front_right_shade
      label: "Right"
    rear_left:
      entity_id: cover.office_front_center_shade
      label: "Rear Left"
    rear_right:
      entity_id: cover.office_door_shade
      label: "Rear Right"
  # Patio light groups shown as two vertical dim faders (Main | BBQ).
  # Stand-in office lights on the Mercer Island HA until the real Sun Peaks
  # patio light groups exist; just swap the entity_id later.
  lights:
    main:
      entity_id: light.office_ceiling_over_desk
      label: "Main"
    bbq:
      entity_id: light.office_ceiling_over_couch
      label: "BBQ"
  # Deck Sonos amp: volume + play/pause/prev/next on the Music tile.
  media:
    entity_id: media_player.sonos_amp
    label: "Music"
